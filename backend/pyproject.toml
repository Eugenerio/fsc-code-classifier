[project]
name = "fsc-classifier"
version = "0.1.0"
description = "Company -> Federal Supply Classification (FSC) code recommender"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "rank-bm25>=0.2.2",
  "numpy>=1.26",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pypdf>=4.2",
  "google-genai>=1.0",
  "typesafe-sdk",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
